# Render blueprint for the Tessera API.
# Free plan: the service sleeps after ~15 minutes idle, so keep an external ping running
# (e.g. cron-job.org every 10 minutes) and the first request of a demo will stay fast.
services:
  - type: web
    name: tessera-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r api/requirements.txt
    startCommand: cd api && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TEAM_NAME
        value: Voltryx
      - key: DATASET_PATH
        value: ./vendor/cit_public.json
      - key: EXPORTS_DIR
        value: ./exports
      - key: LOAD_COMMITTED_EXPORTS
        value: "true"
      - key: SOLVER_WORKERS
        value: "1"          # free instances are small; keep the solver single-threaded
      - key: SOLVER_TIME_LIMIT
        value: "120"
      - key: REPAIR_TIME_LIMIT
        value: "60"
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        value: Tessera@2027
      - key: LLM_PROVIDER
        value: none
      - key: GROQ_API_KEY
        sync: false
