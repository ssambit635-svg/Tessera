# Render blueprint for Tessera — two services, because the UI and the solver scale separately.
#
#   1. tessera-api   Python web service  → FastAPI + OR-Tools (the scheduling authority)
#   2. tessera-web   static site         → the Vite/React workspace, built to frontend/dist
#
# Free plan notes:
#  - a web service sleeps after ~15 min idle, so the first request of a demo is slow;
#    keep an external ping running (cron-job.org, every 10 min) and /health stays warm.
#  - the filesystem is ephemeral: SQLite and ./exports are rebuilt from the committed
#    bundle on every boot (LOAD_COMMITTED_EXPORTS), so nothing is lost that matters.
services:
  - type: web
    name: tessera-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r api/requirements.txt
    startCommand: cd api && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TEAM_NAME
        value: Voltryx
      - key: DATASET_PATH
        value: ./vendor/cit_public.json
      - key: EXPORTS_DIR
        value: ./exports
      - key: LOAD_COMMITTED_EXPORTS
        value: "true"
      - key: SOLVER_WORKERS
        value: "1"          # free instances are small; keep the solver single-threaded
      - key: SOLVER_TIME_LIMIT
        value: "120"
      - key: REPAIR_TIME_LIMIT
        value: "60"
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        value: Tessera@2027
      # "*" is deliberate: the UI is a separate origin and authenticates with a Bearer
      # token, never a cookie, so a wildcard costs nothing and avoids a redeploy dance
      # every time the static-site hostname changes.
      - key: CORS_ORIGINS
        value: "*"
      - key: LLM_PROVIDER
        value: none          # flip to "groq" after adding the key below
      - key: GROQ_API_KEY
        sync: false          # set in the dashboard only — never in this file

  - type: web
    name: tessera-web
    runtime: static
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22.15.0"
      - key: VITE_API_BASE
        sync: false          # https://<your-api-service>.onrender.com
    routes:
      # the app is a client-side router: /landing, /mosaic, /exams all resolve to index.html
      - type: rewrite
        source: /*
        destination: /index.html
