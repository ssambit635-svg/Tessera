name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r api/requirements.txt
      - name: Tests (kernel, exports, repair, API)
        working-directory: api
        run: python -m pytest tests -q
      - name: Official validator on the committed exports
        run: |
          python vendor/validator.py --data vendor/cit_public.json \
            --schedule exports/schedule.json --json ci-report.json
          python vendor/validator.py --data vendor/cit_public.json \
            --schedule exports/schedule_after.json \
            --disruption vendor/sample_disruption.json --baseline exports/schedule.json \
            --json ci-report-after.json
      - name: Fail on any hard violation
        run: |
          python - <<'PY'
          import json, sys
          r = json.load(open("ci-report.json"))
          a = json.load(open("ci-report-after.json"))
          print("timetable:", r["hard_by_rule"], "soft:", r["soft_total"],
                "bookings:", r["bookings"]["booking_score"])
          print("after disruption:", a["hard_by_rule"], "moved:",
                a["stability"]["sessions_moved"],
                f'({a["stability"]["room_only_changed"]} room only)')
          sys.exit(1 if r["hard_violation_count"] + a["hard_violation_count"] else 0)
          PY
      - name: Smoke the API with no LLM configured
        working-directory: api
        env:
          LLM_PROVIDER: none
          DATABASE_URL: sqlite:///./ci.db
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          with TestClient(app) as c:
              assert c.get("/health").json()["status"] == "ok"
              tok = c.post("/api/auth/demo-login/admin").json()["token"]
              h = {"Authorization": f"Bearer {tok}"}
              v = c.get("/api/timetable/validate", headers=h).json()
              print("api validate:", v["hard_violations"], "hard,", v["soft_total"], "soft")
              assert v["hard_violations"] == 0
              b = c.get("/api/bookings", headers=h).json()
              print("api bookings:", b["totals"])
              assert b["totals"]["approved"] == 22
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            ci-report.json
            ci-report-after.json
